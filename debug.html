<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Debug - Публікації</title>
</head>
<body>
  <h1>Debug: Перевірка фото</h1>
  <img src="images/foto1.jpg" alt="Фото 1" style="max-width: 300px; border: 1px solid red;">
  <p>Якщо фото 1 не видно, перевірте консоль (F12).</p>
  <img src="images/foto2.jpg" alt="Фото 2" style="max-width: 300px; border: 1px solid blue;">
  <p>Якщо фото 2 не видно, перевірте консоль (F12).</p>
  <script>
    // JS для перевірки
    document.querySelectorAll('img').forEach(img => {
      img.onerror = () => console.log('Помилка завантаження: ' + img.src);
      img.onload = () => console.log('Завантажено: ' + img.src);
    });
  </script>
</body>
</html>
